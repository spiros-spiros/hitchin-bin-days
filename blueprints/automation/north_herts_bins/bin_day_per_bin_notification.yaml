blueprint:
  name: Bin day notification, one per bin (North Herts)
  description: >-
    Send a separate notification for each bin due tomorrow, at a time you
    choose the evening before.

    If two bins go out on the same day you get two messages, each naming its
    own bin and container. Notifications can go to several services at once.

    Optionally, also add a task per bin to a to-do list (for example a Todoist
    project), due either the evening of the alert or on collection day.
  domain: automation
  source_url: https://github.com/spiros-spiros/hitchin-bin-days/blob/main/blueprints/automation/north_herts_bins/bin_day_per_bin_notification.yaml
  input:
    bin_day_tomorrow:
      name: "Bin day tomorrow sensor"
      description: >-
        The "Bin day tomorrow" binary sensor from the North Herts Bins
        integration.
      selector:
        entity:
          filter:
            - integration: north_herts_bins
              domain: binary_sensor
    notify_services:
      name: Notification services
      description: >-
        One or more notify services, each without the "notify." prefix - for
        example mobile_app_my_phone, or persistent_notification.
      selector:
        text:
          multiple: true
    alert_time:
      name: Alert time
      description: When to send the reminder, the evening before collection.
      default: "17:00:00"
      selector:
        time:
    title:
      name: Notification title
      default: "Bin day"
      selector:
        text:
    todo_list:
      name: To-do list (optional)
      description: >-
        A to-do list to add one task per bin to, such as a Todoist project.
        Leave empty to only send notifications.
      default: ""
      selector:
        entity:
          filter:
            - domain: todo
    todo_due:
      name: To-do task due
      description: Which day the to-do task is due.
      default: alert_day
      selector:
        select:
          options:
            - label: The day of the alert (evening before collection)
              value: alert_day
            - label: Collection day
              value: collection_day

mode: single

variables:
  source: !input bin_day_tomorrow
  notify_services: !input notify_services
  bins: "{{ state_attr(source, 'bins') | default([], true) }}"
  containers: "{{ state_attr(source, 'containers') | default([], true) }}"
  todo_list: !input todo_list
  todo_due: !input todo_due
  todo_due_date: >-
    {{ (now() + timedelta(days=1 if todo_due == 'collection_day' else 0))
       .date().isoformat() }}

triggers:
  - trigger: time
    at: !input alert_time

conditions:
  # Nothing due tomorrow means nothing to say.
  - condition: template
    value_template: "{{ bins | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ bins }}"
      sequence:
        # Captured before the inner repeat, which rebinds `repeat`.
        - variables:
            bin_name: "{{ repeat.item }}"
            # repeat.index is 1-based; guard in case a bin has no container.
            bin_container: >-
              {{ containers[repeat.index - 1]
                 if containers | count >= repeat.index else '' }}
        - repeat:
            for_each: "{{ notify_services }}"
            sequence:
              - action: "notify.{{ repeat.item }}"
                data:
                  title: !input title
                  message: >-
                    {{ bin_name }}{% if bin_container %} ({{ bin_container }}){% endif %}
                    goes out tomorrow
        - if:
            - condition: template
              value_template: "{{ todo_list | default('', true) | length > 0 }}"
          then:
            - action: todo.add_item
              target:
                entity_id: "{{ todo_list }}"
              data:
                item: >-
                  Put out {{ bin_name }}{% if bin_container %} ({{ bin_container }}){% endif %}
                due_date: "{{ todo_due_date }}"
