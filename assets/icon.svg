<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Wheelie bin, straight-on. Colours follow the council's own purple lid
       bin: #682888 lid, #303030 body. -->
  <defs>
    <linearGradient id="lidG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#9D4EBA"/>
      <stop offset="0.5"  stop-color="#7A2E92"/>
      <stop offset="1"    stop-color="#5A1E71"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#4C535C"/>
      <stop offset="0.42" stop-color="#3C434B"/>
      <stop offset="1"    stop-color="#282D33"/>
    </linearGradient>
  </defs>

  <!-- handle bar, rising from behind the lid -->
  <rect x="96" y="20" width="64" height="30" rx="13" fill="#5A1E71"/>

  <!-- wheels, sitting behind the body so only the lower arcs show -->
  <circle cx="90"  cy="204" r="18" fill="#1C1F24"/>
  <circle cx="166" cy="204" r="18" fill="#1C1F24"/>

  <!-- body -->
  <path d="M56 80 H200 L189 200 a13 13 0 0 1 -13 12 H80 a13 13 0 0 1 -13 -12 Z"
        fill="url(#bodyG)"/>

  <!-- recessed front panel + ridges -->
  <path d="M74 102 H182 L173 186 H83 Z" fill="#000" opacity="0.12"/>
  <g fill="#000" opacity="0.16">
    <rect x="99"  y="110" width="8" height="68" rx="4"/>
    <rect x="124" y="110" width="8" height="68" rx="4"/>
    <rect x="149" y="110" width="8" height="68" rx="4"/>
  </g>

  <!-- lid, overhanging the body -->
  <path d="M44 48 H212 a11 11 0 0 1 11 11 v15 a11 11 0 0 1 -11 11 H44
           a11 11 0 0 1 -11 -11 V59 a11 11 0 0 1 11 -11 Z" fill="url(#lidG)"/>
  <path d="M44 48 H212 a11 11 0 0 1 11 11 v5 H33 v-5 a11 11 0 0 1 11 -11 Z"
        fill="#AE68C8" opacity="0.55"/>
  <rect x="33" y="78" width="190" height="7" rx="3" fill="#000" opacity="0.16"/>
</svg>
